<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logic Loop | Login</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="container">
        <div class="form-box" id="signup-box">
            <h2>Join Logic Loop</h2>
            <p>Create your student account</p>
            <form id="signup-form">
                <input type="text" id="reg-name" placeholder="Full Name" required>
                <input type="text" id="reg-grade" placeholder="Grade (e.g., 5th, 8th)" required>
                <select id="reg-group" required>
                    <option value="" disabled selected>Select Your Level</option>
                    <option value="beginner">Beginner</option>
                    <option value="intermediate">Intermediate</option>
                    <option value="advanced">Advanced</option>
                </select>
                <input type="email" id="reg-email" placeholder="Email Address" required>
                <input type="password" id="reg-password" placeholder="Password" required>
                <button type="submit" class="btn">Sign Up</button>
            </form>
            <p class="switch-text">Already have an account? <span class="toggle-link" onclick="window.toggleForms()">Log In here</span></p>
        </div>

        <div class="form-box hidden" id="login-box">
            <h2>Welcome Back!</h2>
            <p>Log in to Logic Loop</p>
            <form id="login-form">
                <input type="email" id="login-email" placeholder="Email Address" required>
                <input type="password" id="login-password" placeholder="Password" required>
                <button type="submit" class="btn">Log In</button>
            </form>
            <p class="switch-text">New to Logic Loop? <span class="toggle-link" onclick="window.toggleForms()">Sign Up here</span></p>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
